name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 问道（howtogo）没有发布过任何版本，也没有发布到 Maven，
      # 所以先把它的源码拉下来，只编 1.21.1-neoforge 这一个模块。
      - name: Build howtogo
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Dong-awa/howtogo.git /tmp/howtogo
          cd /tmp/howtogo
          chmod +x ./gradlew
          ./gradlew :1.21.1-neoforge:build --configure-on-demand --console=plain
          mkdir -p "$GITHUB_WORKSPACE/libs"
          cp versions/1.21.1-neoforge/build/libs/howtogo-neoforge-*.jar \
             "$GITHUB_WORKSPACE/libs/howtogo-0.2.3.jar"
          ls -la "$GITHUB_WORKSPACE/libs"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: htg_connect-jar
          path: build/libs/*.jar
          if-no-files-found: error
