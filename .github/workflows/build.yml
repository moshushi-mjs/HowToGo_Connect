name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 问道（howtogo）的 jar 不在仓库里 —— 那是别人的作品，不该上传。
      # 但编译需要它，所以这里从作者的 GitHub Release 下载。
      # 见 libs/README.md。
      - name: Download howtogo
        run: |
          mkdir -p libs
          curl -sSL --fail -o libs/howtogo-0.2.2.jar \
            "https://github.com/Dong-awa/howtogo/releases/download/v0.2.2/howtogo-0.2.2%2Bmc1.21.1-neoforge.jar"
          ls -la libs/

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: htg_connect-jar
          path: build/libs/*.jar
          if-no-files-found: error